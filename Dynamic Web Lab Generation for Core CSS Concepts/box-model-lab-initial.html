<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Box Model Lab (initial)</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f4f4f4; color: #222; }
    h1 { margin-top: 0; }
    .controls { background: #fff; padding: 15px; border: 1px solid #ccc; border-radius: 6px; max-width: 420px; }
    .controls label { display: block; margin: 8px 0 2px; }
    .controls input[type=range] { width: 70%; }
    .stage { margin-top: 20px; background: #fff; border: 1px dashed #999; padding: 10px; }
    /* the orange wrapper shows the margin area around each box */
    .margin-area { display: flow-root; background: #f9cc9d; }
    .box {
      /* content colour clipped to the content box, padding colour under it */
      background: linear-gradient(#8cb6c0, #8cb6c0) content-box, #c3d08b padding-box;
      border: 5px solid #222;
      padding: 20px;
      margin: 20px;
      width: 150px;
      display: block;
    }
    .legend span { display: inline-block; padding: 2px 8px; margin-right: 6px; }
  </style>
</head>
<body>
  <h1>CSS Box Model Lab</h1>

  <div class="controls">
    <label>Padding: <span id="padVal">20</span>px</label>
    <input type="range" id="pad" min="0" max="60" value="20">

    <label>Margin: <span id="marVal">20</span>px</label>
    <input type="range" id="mar" min="0" max="60" value="20">

    <label>Border width: <span id="borVal">5</span>px</label>
    <input type="range" id="bor" min="0" max="20" value="5">

    <label>Width: <span id="widVal">150</span>px</label>
    <input type="range" id="wid" min="50" max="400" value="150">

    <label>Display:</label>
    <select id="disp">
      <option value="block">block</option>
      <option value="inline-block">inline-block</option>
      <option value="inline">inline</option>
    </select>
  </div>

  <p class="legend">
    <span style="background:#8cb6c0">content</span>
    <span style="background:#c3d08b">padding</span>
    <span style="background:#222;color:#fff">border</span>
    <span style="background:#f9cc9d">margin</span>
  </p>

  <div class="stage">
    <div class="margin-area"><div class="box" id="box1">Box 1</div></div>
    <div class="margin-area"><div class="box" id="box2">Box 2</div></div>
  </div>

  <script>
    const boxes = [document.getElementById('box1'), document.getElementById('box2')];

    function hook(id, prop) {
      const input = document.getElementById(id);
      const label = document.getElementById(id + 'Val');
      input.addEventListener('input', () => {
        label.textContent = input.value;
        boxes.forEach(b => b.style[prop] = input.value + 'px');
      });
    }
    hook('pad', 'padding');
    hook('mar', 'margin');
    hook('bor', 'borderWidth');
    hook('wid', 'width');

    document.getElementById('disp').addEventListener('change', e => {
      boxes.forEach(b => b.style.display = e.target.value);
      // keep the orange wrapper following the box so the margin stays visible
      document.querySelectorAll('.margin-area').forEach(w =>
        w.style.display = e.target.value === 'block' ? 'flow-root' : 'inline-block');
    });
  </script>
</body>
</html>
