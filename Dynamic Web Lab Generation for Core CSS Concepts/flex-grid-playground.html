<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flexbox / Grid Playground</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f4f4f4; color: #222; }
    h1 { margin-top: 0; }
    .controls { display: flex; flex-wrap: wrap; gap: 12px; background: #fff; padding: 12px;
                border: 1px solid #ccc; border-radius: 6px; }
    .controls label { display: flex; flex-direction: column; font-size: 13px; }
    .controls select { margin-top: 4px; padding: 3px; }
    .controls label.off { opacity: 0.4; }
    #container {
      margin-top: 20px; min-height: 320px; background: #fff;
      border: 2px dashed #555; padding: 10px; gap: 10px;
      display: flex;
    }
    .item { background: #ff5a5f; color: #fff; font-weight: bold; padding: 15px;
            border-radius: 4px; text-align: center; }
    /* different heights so align-items actually shows something */
    .item:nth-child(2) { padding: 30px 15px; }
    .item:nth-child(4) { padding: 45px 15px; }
    pre { background: #222; color: #9f9; padding: 10px; font-size: 13px; }
  </style>
</head>
<body>
  <h1>Flexbox / Grid Playground</h1>

  <div class="controls" id="controls">
    <label>display
      <select id="display"><option>flex</option><option>grid</option><option>block</option></select></label>
    <label data-for="flex">flex-direction
      <select id="flexDirection"><option>row</option><option>row-reverse</option>
        <option>column</option><option>column-reverse</option></select></label>
    <label>justify-content
      <select id="justifyContent"><option>flex-start</option><option>center</option>
        <option>flex-end</option><option>space-between</option><option>space-around</option>
        <option>space-evenly</option></select></label>
    <label>align-items
      <select id="alignItems"><option>stretch</option><option>flex-start</option>
        <option>center</option><option>flex-end</option><option>baseline</option></select></label>
    <label data-for="grid">grid-template-columns
      <select id="gridTemplateColumns"><option>1fr 1fr 1fr</option><option>repeat(2, 1fr)</option>
        <option>100px 1fr 100px</option><option>repeat(5, 1fr)</option>
        <option>repeat(auto-fill, minmax(120px, 1fr))</option><option>2fr 1fr</option></select></label>
  </div>

  <div id="container">
    <div class="item">1</div><div class="item">2</div><div class="item">3</div>
    <div class="item">4</div><div class="item">5</div>
  </div>

  <pre id="css"></pre>

  <script>
    const box = document.getElementById('container');
    const ids = ['display', 'flexDirection', 'justifyContent', 'alignItems', 'gridTemplateColumns'];
    const kebab = s => s.replace(/[A-Z]/g, m => '-' + m.toLowerCase());

    function update() {
      const display = document.getElementById('display').value;
      const lines = [];
      ids.forEach(id => {
        const v = document.getElementById(id).value;
        // only apply a property when it does something for the current display
        const used = id === 'display' ||
          (id === 'flexDirection' && display === 'flex') ||
          (id === 'gridTemplateColumns' && display === 'grid') ||
          ((id === 'justifyContent' || id === 'alignItems') && display !== 'block');
        box.style[id] = used ? v : '';
        if (used) lines.push(kebab(id) + ': ' + v + ';');
      });
      document.querySelectorAll('label[data-for]').forEach(l =>
        l.classList.toggle('off', l.dataset.for !== display));
      document.getElementById('css').textContent = '#container {\n  ' + lines.join('\n  ') + '\n}';
    }

    document.getElementById('controls').addEventListener('change', update);
    update();
  </script>
</body>
</html>
